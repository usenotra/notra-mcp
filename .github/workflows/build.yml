name: Build
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check server version matches package.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { SERVER_VERSION } from './build/server.js';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (SERVER_VERSION !== version) {
            throw new Error(`SERVER_VERSION (${SERVER_VERSION}) does not match package.json (${version})`);
          }
          console.log(`Server and package versions match: ${version}`);
          NODE
      - name: Smoke test server initialization
        run: |
          node --input-type=module <<'NODE'
          import { createServer } from './build/server.js';
          import { listPostsSchema } from './build/schemas/post.js';

          listPostsSchema.parse({ status: 'draft,published' });
          const server = createServer('ci-smoke-test');
          await server.close();
          console.log(`Server initialization and compiled validation passed on ${process.version}`);
          NODE
