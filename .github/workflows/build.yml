name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check server version matches package.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { SERVER_VERSION } from './build/server.js';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (SERVER_VERSION !== version) {
            throw new Error(`SERVER_VERSION (${SERVER_VERSION}) does not match package.json (${version})`);
          }
          console.log(`Server and package versions match: ${version}`);
          NODE
      - name: Smoke test server initialization
        run: |
          node --input-type=module <<'NODE'
          import { createServer } from './build/server.js';
          import { listPostsSchema } from './build/schemas/post.js';

          listPostsSchema.parse({ status: 'draft,published' });
          const server = createServer('ci-smoke-test');
          await server.close();
          console.log(`Server initialization and compiled validation passed on ${process.version}`);
          NODE
